<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Serwis PRO+</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* ── RESET & ROOT ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:       #0a0f14;
  --bg2:      #0f1923;
  --bg3:      #131f2e;
  --surface:  #172535;
  --surface2: #1c2e42;
  --border:   rgba(255,255,255,.07);
  --border2:  rgba(255,255,255,.12);
  --text:     #e8edf2;
  --text2:    #8fa3b8;
  --text3:    #4d6478;
  --accent:   #00b4d8;
  --accent2:  #0077a3;
  --green:    #00c896;
  --red:      #ff4d6d;
  --orange:   #ff8c42;
  --yellow:   #ffd166;
  --purple:   #a78bfa;
  --r:        12px;
  --r2:       8px;
  --sh:       0 4px 24px rgba(0,0,0,.4);
  --sh2:      0 2px 8px rgba(0,0,0,.3);
  --font:     'Barlow', sans-serif;
  --font2:    'Barlow Condensed', sans-serif;
  --nav-h:    64px;
  --safe-b:   env(safe-area-inset-bottom, 0px);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font)}
body{display:flex;flex-direction:column}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:2px}

/* ── TYPOGRAPHY ── */
h1,h2,h3,h4{font-family:var(--font2);font-weight:700;letter-spacing:.02em}

/* ── LAYOUT ── */
#app{flex:1;display:flex;flex-direction:column;overflow:hidden}
.view{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px;padding-bottom:calc(var(--nav-h) + var(--safe-b) + 16px);display:none;animation:fadeIn .2s ease}
.view.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ── TOP BAR ── */
#topbar{
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  padding:12px 16px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
  backdrop-filter:blur(20px);
}
#topbar-title{font-family:var(--font2);font-size:20px;font-weight:800;letter-spacing:.05em;color:var(--accent)}
#topbar-sub{font-size:12px;color:var(--text3);margin-top:1px}
#topbar-right{display:flex;gap:8px}

/* ── BOTTOM NAV ── */
#nav{
  height:var(--nav-h);
  background:var(--bg2);
  border-top:1px solid var(--border);
  display:flex;align-items:center;
  padding-bottom:var(--safe-b);
  position:relative;z-index:100;
}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;padding:8px 4px;cursor:pointer;border:none;background:none;
  color:var(--text3);transition:color .15s;font-family:var(--font);
}
.nav-btn.active{color:var(--accent)}
.nav-btn svg{width:22px;height:22px;stroke-width:1.8}
.nav-btn span{font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}

/* ── CARDS ── */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:16px;
  margin-bottom:12px;
  box-shadow:var(--sh2);
}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-title{font-family:var(--font2);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text2)}

/* ── STAT GRID ── */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat-box{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);
  padding:14px;position:relative;overflow:hidden;
}
.stat-box::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--accent);opacity:.6;
}
.stat-box.green::before{background:var(--green)}
.stat-box.orange::before{background:var(--orange)}
.stat-box.purple::before{background:var(--purple)}
.stat-label{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.stat-value{font-family:var(--font2);font-size:24px;font-weight:800;color:var(--text);line-height:1}
.stat-sub{font-size:11px;color:var(--text3);margin-top:4px}

/* ── ZLECENIE ROW ── */
.zlecenie-row{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);
  padding:14px;margin-bottom:8px;cursor:pointer;
  transition:border-color .15s,background .15s;
  display:flex;gap:12px;align-items:flex-start;
}
.zlecenie-row:active{background:var(--surface2);border-color:var(--border2)}
.zlecenie-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:6px}
.zlecenie-body{flex:1;min-width:0}
.zlecenie-klient{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zlecenie-zadanie{font-size:12px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zlecenie-meta{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.tag{font-size:10px;font-weight:600;letter-spacing:.05em;padding:2px 8px;border-radius:20px;white-space:nowrap}
.tag-nowe{background:rgba(255,140,66,.15);color:var(--orange)}
.tag-toku{background:rgba(255,209,102,.15);color:var(--yellow)}
.tag-zakonczone{background:rgba(0,200,150,.15);color:var(--green)}
.tag-zafakturowane{background:rgba(0,180,216,.15);color:var(--accent)}
.zlecenie-price{font-family:var(--font2);font-weight:700;font-size:16px;color:var(--green);white-space:nowrap}

/* ── BUTTONS ── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 20px;border-radius:var(--r2);border:none;cursor:pointer;
  font-family:var(--font);font-size:14px;font-weight:600;letter-spacing:.02em;
  transition:all .15s;white-space:nowrap;
}
.btn-primary{background:var(--accent);color:#000}
.btn-primary:active{background:var(--accent2);transform:scale(.98)}
.btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border2)}
.btn-ghost:active{background:var(--surface);transform:scale(.98)}
.btn-danger{background:rgba(255,77,109,.15);color:var(--red);border:1px solid rgba(255,77,109,.3)}
.btn-green{background:var(--green);color:#000}
.btn-sm{padding:8px 14px;font-size:12px}
.btn-block{width:100%;display:flex}
.btn-icon{padding:10px;border-radius:var(--r2)}

/* ── FAB ── */
#fab{
  position:fixed;bottom:calc(var(--nav-h) + var(--safe-b) + 16px);right:16px;
  width:56px;height:56px;border-radius:50%;background:var(--accent);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 20px rgba(0,180,216,.4);cursor:pointer;border:none;
  z-index:200;transition:transform .15s,box-shadow .15s;
}
#fab:active{transform:scale(.93);box-shadow:0 2px 10px rgba(0,180,216,.3)}
#fab svg{width:24px;height:24px;color:#000}

/* ── MODAL ── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;
  display:none;align-items:flex-end;justify-content:center;
  backdrop-filter:blur(4px);
}
.modal-overlay.open{display:flex;animation:modalIn .25s ease}
@keyframes modalIn{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--bg2);border-radius:20px 20px 0 0;
  width:100%;max-height:92vh;overflow-y:auto;
  padding:8px 0 calc(var(--safe-b) + 16px);
  animation:slideUp .25s ease;
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:8px auto 20px}
.modal-title{font-family:var(--font2);font-size:22px;font-weight:800;padding:0 20px 16px;border-bottom:1px solid var(--border)}
.modal-body{padding:20px}
.modal-footer{padding:16px 20px 0;display:flex;gap:10px}

/* ── FORMS ── */
.form-group{margin-bottom:16px}
.form-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:6px;display:block}
.form-input,.form-select,.form-textarea{
  width:100%;background:var(--surface);border:1px solid var(--border2);
  border-radius:var(--r2);padding:12px 14px;color:var(--text);
  font-family:var(--font);font-size:15px;outline:none;
  transition:border-color .15s;
  -webkit-appearance:none;appearance:none;
}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--accent)}
.form-textarea{min-height:80px;resize:none}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ── SECTIONS ── */
.section-label{
  font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text3);margin-bottom:10px;margin-top:4px;
  display:flex;align-items:center;gap:8px;
}
.section-label::after{content:'';flex:1;height:1px;background:var(--border)}

/* ── BADGE ── */
.badge{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:18px;height:18px;border-radius:9px;padding:0 5px;
  font-size:10px;font-weight:700;background:var(--red);color:#fff;
}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:48px 24px;color:var(--text3)}
.empty svg{width:48px;height:48px;margin-bottom:16px;opacity:.3}
.empty p{font-size:14px;margin-top:8px}

/* ── KLIENT CARD ── */
.klient-row{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);
  padding:14px;margin-bottom:8px;display:flex;align-items:center;gap:14px;cursor:pointer;
  transition:border-color .15s;
}
.klient-row:active{border-color:var(--border2)}
.klient-avatar{
  width:42px;height:42px;border-radius:50%;background:var(--surface2);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  font-family:var(--font2);font-size:16px;font-weight:800;color:var(--accent);
}
.klient-info{flex:1;min-width:0}
.klient-name{font-weight:600;font-size:15px}
.klient-addr{font-size:12px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.klient-actions{display:flex;gap:8px}

/* ── REGION BADGE ── */
.region-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;letter-spacing:.04em}
.region-Wschód{background:rgba(0,200,150,.12);color:var(--green)}
.region-Zachód{background:rgba(0,180,216,.12);color:var(--accent)}
.region-Południe{background:rgba(167,139,250,.12);color:var(--purple)}
.region-Daleko{background:rgba(255,140,66,.12);color:var(--orange)}

/* ── ZADANIA ── */
.zadanie-row{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);
  padding:14px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;
}
.zadanie-check{
  width:22px;height:22px;border-radius:50%;border:2px solid var(--border2);
  flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .15s;margin-top:1px;
}
.zadanie-check.done{background:var(--green);border-color:var(--green)}
.zadanie-body{flex:1;min-width:0}
.zadanie-tytul{font-weight:600;font-size:15px}
.zadanie-tytul.done{text-decoration:line-through;color:var(--text3)}
.zadanie-meta{display:flex;gap:8px;margin-top:5px;flex-wrap:wrap}
.prio-pilne{color:var(--red)}
.prio-wysoki{color:var(--orange)}
.prio-normalny{color:var(--yellow)}
.prio-niski{color:var(--green)}

/* ── CHART CONTAINER ── */
.chart-wrap{position:relative;height:200px;margin-top:4px}

/* ── DETAIL VIEW ── */
.detail-header{
  background:linear-gradient(135deg,var(--surface) 0%,var(--bg3) 100%);
  border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:12px;
}
.detail-id{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--text3);text-transform:uppercase;margin-bottom:6px}
.detail-klient{font-family:var(--font2);font-size:28px;font-weight:800;line-height:1.1}
.detail-zadanie{font-size:14px;color:var(--text2);margin-top:6px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.detail-item{background:var(--bg2);border-radius:var(--r2);padding:10px 12px}
.detail-item-label{font-size:10px;color:var(--text3);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
.detail-item-value{font-weight:600;font-size:14px}

/* ── VOICE BTN ── */
#voice-btn{
  width:64px;height:64px;border-radius:50%;border:none;
  background:var(--surface2);color:var(--text);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;flex-shrink:0;
}
#voice-btn.recording{background:var(--red);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,77,109,.4)}50%{box-shadow:0 0 0 12px rgba(255,77,109,0)}}

/* ── SCANNER ── */
#scanner-wrap{
  background:#000;border-radius:var(--r);overflow:hidden;
  position:relative;margin-bottom:12px;aspect-ratio:16/9;
}
#scanner-video{width:100%;height:100%;object-fit:cover}
.scanner-frame{
  position:absolute;inset:20%;border:2px solid var(--accent);border-radius:8px;
  box-shadow:0 0 0 1000px rgba(0,0,0,.5);
}

/* ── TOAST ── */
#toast{
  position:fixed;bottom:calc(var(--nav-h) + var(--safe-b) + 80px);left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--surface2);border:1px solid var(--border2);
  border-radius:40px;padding:10px 20px;font-size:13px;font-weight:600;
  white-space:nowrap;z-index:1000;opacity:0;transition:all .3s;pointer-events:none;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── LOADING ── */
.spinner{
  width:32px;height:32px;border:3px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;
  animation:spin .7s linear infinite;margin:0 auto;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{display:flex;flex-direction:column;align-items:center;gap:12px;padding:48px;color:var(--text3);font-size:13px}

/* ── NOTIFICATION BELL ── */
#notif-btn{
  width:36px;height:36px;border-radius:50%;background:var(--surface2);
  border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
  cursor:pointer;position:relative;
}

/* ── WAZE BTN ── */
.waze-btn{
  display:inline-flex;align-items:center;gap:6px;padding:8px 14px;
  background:rgba(0,180,216,.1);border:1px solid rgba(0,180,216,.3);
  border-radius:var(--r2);color:var(--accent);font-size:12px;font-weight:600;
  cursor:pointer;text-decoration:none;transition:background .15s;
}
.waze-btn:active{background:rgba(0,180,216,.2)}

/* ── FAKTURA ── */
.faktura-preview{
  background:#fff;color:#000;border-radius:var(--r);
  padding:20px;font-size:12px;line-height:1.5;
  font-family:'Barlow',sans-serif;
}

/* ── SEPARATOR ── */
.sep{height:1px;background:var(--border);margin:16px 0}

/* ── SWIPE TO DELETE ── */
.swipeable{position:relative;overflow:hidden}
.swipe-action{
  position:absolute;right:0;top:0;bottom:0;width:80px;
  background:var(--red);display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:11px;font-weight:700;letter-spacing:.05em;
  transform:translateX(100%);transition:transform .2s;border-radius:0 var(--r2) var(--r2) 0;
}

/* ── TABS ── */
.tabs{display:flex;gap:4px;background:var(--surface);border-radius:var(--r2);padding:4px;margin-bottom:16px}
.tab{flex:1;padding:8px;border-radius:6px;border:none;background:none;color:var(--text3);
  font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;text-align:center}
.tab.active{background:var(--surface2);color:var(--text)}

/* ── OFFLINE BANNER ── */
#offline-banner{
  background:var(--orange);color:#000;text-align:center;
  font-size:12px;font-weight:700;padding:6px;display:none;
}

/* ── RESPONSIVE ── */
@media(min-width:600px){
  .stat-grid{grid-template-columns:repeat(4,1fr)}
  .modal{max-width:480px;border-radius:20px;margin:auto}
  .modal-overlay{align-items:center}
}
</style>
</head>
<body>

<div id="offline-banner">📡 Tryb offline – dane mogą być nieaktualne</div>

<div id="app">
  <!-- TOP BAR -->
  <div id="topbar">
    <div>
      <div id="topbar-title">SERWIS PRO+</div>
      <div id="topbar-sub" id="topbar-date"></div>
    </div>
    <div id="topbar-right">
      <button id="notif-btn" onclick="requestNotifications()" title="Powiadomienia">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="18" height="18">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- VIEWS -->
  <div class="view active" id="view-dashboard"><!-- filled by JS --></div>
  <div class="view" id="view-zlecenia"><!-- filled by JS --></div>
  <div class="view" id="view-klienci"><!-- filled by JS --></div>
  <div class="view" id="view-zadania"><!-- filled by JS --></div>
  <div class="view" id="view-more"><!-- filled by JS --></div>

  <!-- BOTTOM NAV -->
  <nav id="nav">
    <button class="nav-btn active" data-view="dashboard" onclick="switchView('dashboard',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      <span>Dashboard</span>
    </button>
    <button class="nav-btn" data-view="zlecenia" onclick="switchView('zlecenia',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      <span>Zlecenia</span>
    </button>
    <button class="nav-btn" data-view="klienci" onclick="switchView('klienci',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>Klienci</span>
    </button>
    <button class="nav-btn" data-view="zadania" onclick="switchView('zadania',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 11l3 3L22 4"/><circle cx="12" cy="12" r="10"/></svg>
      <span>Zadania</span>
    </button>
    <button class="nav-btn" data-view="more" onclick="switchView('more',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
      <span>Więcej</span>
    </button>
  </nav>
</div>

<!-- FAB -->
<button id="fab" onclick="openFab()">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="24" height="24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
</button>

<!-- TOAST -->
<div id="toast"></div>

<!-- MODALS -->
<div class="modal-overlay" id="modal-zlecenie">
  <div class="modal">
    <div class="modal-handle"></div>

<script>
// ══════════════════════════════════════════════
// CONFIG – wklej URL z Apps Script Web App
// ══════════════════════════════════════════════
const API_URL = localStorage.getItem('api_url') || 'WKLEJ_URL_APPS_SCRIPT_TUTAJ';

// ══════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════
let STATE = {
  zlecenia:  [],
  klienci:   [],
  zadania:   JSON.parse(localStorage.getItem('zadania') || '[]'),
  notatnik:  [],
  stats:     null,
  loaded:    false,
  scanMode:  'tablica',
  scanStream: null,
  recognition: null,
  charts:    {},
};

// ══════════════════════════════════════════════
// API
// ══════════════════════════════════════════════
function apiJsonp(action, params) {
  return new Promise((resolve) => {
    const cbName = 'cb_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    const script = document.createElement('script');
    const timeout = setTimeout(() => {
      delete window[cbName];
      if(document.body.contains(script)) document.body.removeChild(script);
      resolve({ error: 'timeout' });
    }, 12000);
    window[cbName] = (data) => {
      clearTimeout(timeout);
      delete window[cbName];
      if(document.body.contains(script)) document.body.removeChild(script);
      resolve(data);
    };
    let url = API_URL + '?action=' + action + '&callback=' + cbName;
    if (params) {
      Object.entries(params).forEach(([k,v]) => {
        if (v !== null && v !== undefined) url += '&' + k + '=' + encodeURIComponent(v);
      });
    }
    script.src = url;
    script.onerror = () => { clearTimeout(timeout); resolve({ error: 'offline' }); };
    document.body.appendChild(script);
  });
}

async function api(action, method='GET', body=null) {
  try {
    // All requests go through JSONP GET to avoid CORS
    return await apiJsonp(action, body);
  } catch(e) {
    console.warn('API error:', e.message);
    return { error: 'offline' };
  }
}

async function loadAll() {
  showLoading();
  const [stats, plan, klienci] = await Promise.all([
    api('getStats'), api('getPlan'), api('getKlienci')
  ]);
  STATE.stats    = stats.error ? null : stats;
  STATE.zlecenia = plan.zlecenia || [];
  STATE.klienci  = klienci.klienci || [];
  STATE.loaded   = true;
  renderAll();
  hideLoading();
}

function showLoading() {
  document.getElementById('view-dashboard').innerHTML = '<div class="loading"><div class="spinner"></div><span>Ładowanie danych...</span></div>';
}
function hideLoading() {}

// ══════════════════════════════════════════════
// NAVIGATION
// ══════════════════════════════════════════════
let currentView = 'dashboard';
function switchView(v, btn) {
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
  document.getElementById('view-' + v).classList.add('active');
  if(btn) btn.classList.add('active');
  currentView = v;
  renderView(v);
  document.getElementById('fab').style.display = v === 'more' ? 'none' : 'flex';
}

function renderAll() {
  renderView(currentView);
}

function renderView(v) {
  if (v === 'dashboard') renderDashboard();
  if (v === 'zlecenia')  renderZlecenia();
  if (v === 'klienci')   renderKlienci();
  if (v === 'zadania')   renderZadania();
  if (v === 'more')      renderMore();
}

// ══════════════════════════════════════════════
// DASHBOARD
// ══════════════════════════════════════════════
function renderDashboard() {
  const s   = STATE.stats;
  const now = new Date();
  const months = ['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec','Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];
  document.getElementById('topbar-sub').textContent = formatDate(now);

  const dzis = STATE.zlecenia.filter(z => z.data === toDateStr(now));
  const niezamkniete = STATE.zlecenia.filter(z => z.status === '🆕 nowe' || z.status === '⚙️ w toku');

  const el = document.getElementById('view-dashboard');
  el.innerHTML = `
    <div class="section-label">Ten miesiąc</div>
    <div class="stat-grid">
      <div class="stat-box">
        <div class="stat-label">Przychód</div>
        <div class="stat-value">${fmt(s?.miesiac?.przychod||0)}</div>
        <div class="stat-sub">zł brutto</div>
      </div>
      <div class="stat-box green">
        <div class="stat-label">Zysk</div>
        <div class="stat-value">${fmt((s?.miesiac?.przychod||0)-(s?.miesiac?.koszt||0))}</div>
        <div class="stat-sub">zł netto</div>
      </div>
      <div class="stat-box orange">
        <div class="stat-label">Zlecenia</div>
        <div class="stat-value">${s?.miesiac?.zlecenia||0}</div>
        <div class="stat-sub">w tym miesiącu</div>
      </div>
      <div class="stat-box purple">
        <div class="stat-label">YTD</div>
        <div class="stat-value">${fmt(s?.ytd?.przychod||0)}</div>
        <div class="stat-sub">zł od początku roku</div>
      </div>
    </div>

    <div class="section-label">Status zleceń</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
      ${statusBox('🆕 Nowe', s?.statusCount?.nowe||0,'tag-nowe')}
      ${statusBox('⚙️ W toku', s?.statusCount?.wToku||0,'tag-toku')}
      ${statusBox('✅ Zakończone', s?.statusCount?.zakonczone||0,'tag-zakonczone')}
      ${statusBox('🧾 Zafakturowane', s?.statusCount?.zafakturowane||0,'tag-zafakturowane')}
    </div>

    ${dzis.length > 0 ? `
    <div class="section-label">Dziś (${dzis.length})</div>
    ${dzis.map(z => zlecenieRow(z)).join('')}
    ` : ''}

    ${niezamkniete.length > 0 ? `
    <div class="section-label" style="color:var(--orange)">⚠ Niezamknięte (${niezamkniete.length})</div>
    ${niezamkniete.slice(0,3).map(z => zlecenieRow(z)).join('')}
    ${niezamkniete.length > 3 ? `<div style="text-align:center;color:var(--text3);font-size:12px;padding:8px">i ${niezamkniete.length-3} więcej...</div>` : ''}
    ` : ''}

    <div class="section-label">Przychody – ostatnie 6 miesięcy</div>
    <div class="card">
      <div class="chart-wrap"><canvas id="chart-przychody"></canvas></div>
    </div>
  `;

  setTimeout(() => renderChartPrzychody(), 100);
}

function statusBox(lbl, val, cls) {
  return `<div class="card" style="margin-bottom:0;padding:12px">
    <div class="stat-label">${lbl}</div>
    <div class="stat-value" style="font-size:28px">${val}</div>
  </div>`;
}

function renderChartPrzychody() {
  const canvas = document.getElementById('chart-przychody');
  if (!canvas) return;
  if (STATE.charts.przychody) STATE.charts.przychody.destroy();

  const now = new Date();
  const labels = [], przychody = [], koszty = [];

  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const m = d.getMonth(); const y = d.getFullYear();
    labels.push(['Sty','Lut','Mar','Kwi','Maj','Cze','Lip','Sie','Wrz','Paź','Lis','Gru'][m]);
    const miesiac = STATE.zlecenia.filter(z => {
      const zd = new Date(z.data);
      return zd.getMonth()===m && zd.getFullYear()===y;
    });
    przychody.push(miesiac.reduce((a,z) => a+(parseFloat(z.przychod)||0), 0));
    koszty.push(miesiac.reduce((a,z) => a+(parseFloat(z.koszt)||0), 0));
  }

  STATE.charts.przychody = new Chart(canvas, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: 'Przychód', data: przychody, backgroundColor: 'rgba(0,180,216,.7)', borderRadius: 4 },
        { label: 'Koszt',    data: koszty,    backgroundColor: 'rgba(255,77,109,.5)', borderRadius: 4 },
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { color: '#8fa3b8', font: { size: 11 } } } },
      scales: {
        x: { grid: { color: 'rgba(255,255,255,.05)' }, ticks: { color: '#8fa3b8' } },
        y: { grid: { color: 'rgba(255,255,255,.05)' }, ticks: { color: '#8fa3b8', callback: v => fmt(v) } }
      }
    }
  });
}

// ══════════════════════════════════════════════
// ZLECENIA
// ══════════════════════════════════════════════
let zlFilter = 'wszystkie';
function renderZlecenia() {
  const statuses = ['wszystkie','nowe','w toku','zakończone','zafakturowane'];
  const filtered = zlFilter === 'wszystkie'
    ? STATE.zlecenia
    : STATE.zlecenia.filter(z => z.status && z.status.toLowerCase().includes(zlFilter));

  const sorted = [...filtered].sort((a,b) => new Date(b.data) - new Date(a.data));

  document.getElementById('view-zlecenia').innerHTML = `
    <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none">
      ${statuses.map(s => `<button class="tag ${zlFilter===s?'tag-toku':''}" style="padding:6px 14px;cursor:pointer;white-space:nowrap;background:var(--surface);border:1px solid var(--border);border-radius:20px;color:var(--text)" onclick="zlFilter='${s}';renderZlecenia()">${s}</button>`).join('')}
    </div>
    ${sorted.length === 0
      ? `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 11l3 3L22 4"/></svg><p>Brak zleceń</p></div>`
      : sorted.map(z => zlecenieRow(z)).join('')
    }
  `;
}

function zlecenieRow(z) {
  const dot = z.status?.includes('nowe') ? '#ff8c42'
    : z.status?.includes('toku') ? '#ffd166'

let zadFilter = 'aktywne';
function renderZadania() {
  const now = new Date().toISOString().split('T')[0];
  let list = STATE.zadania;
  if (zadFilter === 'aktywne') list = list.filter(z => z.status !== 'zrobione');
  if (zadFilter === 'zrobione') list = list.filter(z => z.status === 'zrobione');

  const przeterminowane = list.filter(z => z.termin && z.termin < now && z.status !== 'zrobione');
  const dzisiaj = list.filter(z => z.termin === now && z.status !== 'zrobione');
  const pozostale = list.filter(z => (!z.termin || z.termin > now) && z.status !== 'zrobione');
  const zrobione = list.filter(z => z.status === 'zrobione');

  const el = document.getElementById('view-zadania');
  el.innerHTML = `
    <div class="tabs">
      <button class="tab ${zadFilter==='aktywne'?'active':''}" onclick="zadFilter='aktywne';renderZadania()">Aktywne</button>
      <button class="tab ${zadFilter==='wszystkie'?'active':''}" onclick="zadFilter='wszystkie';renderZadania()">Wszystkie</button>
      <button class="tab ${zadFilter==='zrobione'?'active':''}" onclick="zadFilter='zrobione';renderZadania()">Zrobione</button>
    </div>
    ${zadFilter !== 'zrobione' ? `
      ${przeterminowane.length > 0 ? `<div class="section-label" style="color:var(--red)">⚠ Przeterminowane</div>${przeterminowane.map(z => zadanieRow(z)).join('')}` : ''}
      ${dzisiaj.length > 0 ? `<div class="section-label" style="color:var(--yellow)">Dziś</div>${dzisiaj.map(z => zadanieRow(z)).join('')}` : ''}
      ${pozostale.length > 0 ? `<div class="section-label">Nadchodzące</div>${pozostale.map(z => zadanieRow(z)).join('')}` : ''}
      ${list.length === 0 ? '<div class="empty"><p>Brak aktywnych zadań 🎉</p></div>' : ''}
    ` : zrobione.map(z => zadanieRow(z)).join('')}
  `;
}

function zadanieRow(z) {
  const done = z.status === 'zrobione';
  const prioColor = z.prio?.includes('pilne') ? 'var(--red)' : z.prio?.includes('wysoki') ? 'var(--orange)' : z.prio?.includes('normalny') ? 'var(--yellow)' : 'var(--green)';
  return `<div class="zadanie-row">
    <div class="zadanie-check ${done?'done':''}" onclick="toggleZadanie('${z.id}')">
      ${done ? `<svg viewBox="0 0 24 24" fill="none" stroke="#000" width="12" height="12"><path d="M20 6L9 17l-5-5"/></svg>` : ''}
    </div>
    <div class="zadanie-body">
      <div class="zadanie-tytul ${done?'done':''}">${z.tytul}</div>
      <div class="zadanie-meta">
        <span style="font-size:11px;color:${prioColor};font-weight:700">${z.prio||''}</span>
        ${z.termin ? `<span style="font-size:11px;color:var(--text3)">${z.termin}</span>` : ''}
        ${z.klient ? `<span style="font-size:11px;color:var(--text3)">${z.klient}</span>` : ''}
        ${z.pow && z.pow !== 'jednorazowe' ? `<span style="font-size:11px;color:var(--accent)">↻ ${z.pow}</span>` : ''}
      </div>
    </div>
    <button onclick="deleteZadanie('${z.id}')" style="background:none;border:none;color:var(--text3);cursor:pointer;padding:4px">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="16" height="16"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>`;
}

function toggleZadanie(id) {
  const z = STATE.zadania.find(x => x.id === id);
  if (!z) return;
  z.status = z.status === 'zrobione' ? 'aktywne' : 'zrobione';
  if (z.status === 'zrobione' && z.pow !== 'jednorazowe') {
    // Utwórz kolejne powtórzenie
    const next = { ...z, id: Date.now().toString(), status: 'aktywne', termin: nextDate(z.termin, z.pow) };
    STATE.zadania.push(next);
  }
  saveZadania();
  renderZadania();
}

function deleteZadanie(id) {
  STATE.zadania = STATE.zadania.filter(x => x.id !== id);
  saveZadania();
  renderZadania();
}

function saveZadania() {
  localStorage.setItem('zadania', JSON.stringify(STATE.zadania));
}

function nextDate(dateStr, pow) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (pow === 'codziennie') d.setDate(d.getDate()+1);
  if (pow === 'co tydzień') d.setDate(d.getDate()+7);
  if (pow === 'co miesiąc') d.setMonth(d.getMonth()+1);
  return d.toISOString().split('T')[0];
}

// FAKTURA VAT PDF
// ══════════════════════════════════════════════
function generujFakture(id) {
  const z = STATE.zlecenia.find(x => x.id === id);
  if (!z) return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });

  const netto = parseFloat(z.przychod) || 0;
  const vat23 = netto * 0.23;
  const brutto = netto + vat23;
  const dzis = new Date().toLocaleDateString('pl-PL');
  const nrFaktury = 'FV/' + new Date().getFullYear() + '/' + String(new Date().getMonth()+1).padStart(2,'0') + '/' + z.id;

  doc.setFont('helvetica');

  // Nagłówek
  doc.setFillColor(10, 15, 20);
  doc.rect(0, 0, 210, 40, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFontSize(22); doc.setFont('helvetica','bold');
  doc.text('FAKTURA VAT', 20, 20);
  doc.setFontSize(11); doc.setFont('helvetica','normal');
  doc.text('Nr: ' + nrFaktury, 20, 30);
  doc.text('Data: ' + dzis, 130, 20);
  doc.text('Termin płatności: ' + dzis, 130, 30);

  // Sprzedawca
  doc.setTextColor(0, 0, 0);
  doc.setFontSize(10); doc.setFont('helvetica','bold');
  doc.text('SPRZEDAWCA', 20, 55);
  doc.setFont('helvetica','normal');
  doc.text('[Twoja firma]', 20, 62);
  doc.text('[Twój adres]', 20, 68);
  doc.text('NIP: [Twój NIP]', 20, 74);

  // Nabywca
  doc.setFont('helvetica','bold');
  doc.text('NABYWCA', 120, 55);
  doc.setFont('helvetica','normal');
  doc.text(z.klient, 120, 62);
  if (z.adres) doc.text(z.adres, 120, 68);
  if (z.miasto) doc.text(z.miasto, 120, 74);

  // Separator
  doc.setDrawColor(200, 200, 200);
  doc.line(20, 82, 190, 82);

  // Tabela
  doc.setFillColor(240, 240, 240);
  doc.rect(20, 85, 170, 8, 'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(9);
  doc.text('Lp.', 22, 91); doc.text('Opis', 32, 91);

function openSzablonDla(klient, adres, typ='wybierz') {

// ══════════════════════════════════════════════
// PLAN DNIA / TRASA
// ══════════════════════════════════════════════
function planDnia() {
  const dzis = new Date().toISOString().split('T')[0];
  const wizytySerwisowe = STATE.zlecenia.filter(z => z.data === dzis && z.adres);

  if (wizytySerwisowe.length === 0) {
    toast('Brak zaplanowanych wizyt na dziś z adresem');
    return;
  }

  if (!navigator.geolocation) { toast('Brak geolokalizacji'); return; }

  navigator.geolocation.getCurrentPosition(pos => {
    const lat = pos.coords.latitude, lon = pos.coords.longitude;

    // Prosta optymalizacja – sortuj wg odległości od aktualnej pozycji
    const punkty = wizytySerwisowe.map(z => {
      const adres = encodeURIComponent([z.adres, z.miasto, 'Polska'].filter(Boolean).join(', '));
      return { z, adres, dist: null };
    });

    document.getElementById('modal-detail-body').innerHTML = `
      <div class="detail-id">Plan dnia – ${dzis}</div>
      <div style="margin:12px 0;font-size:13px;color:var(--text2)">Twoja pozycja: ${lat.toFixed(4)}, ${lon.toFixed(4)}</div>
      ${punkty.map((p, i) => `
        <div class="detail-item" style="margin-bottom:8px">
          <div class="detail-item-label">Wizyta ${i+1}</div>
          <div class="detail-item-value">${p.z.klient}</div>
          <div style="font-size:12px;color:var(--text2);margin-top:4px">${[p.z.adres,p.z.miasto].filter(Boolean).join(', ')}</div>
          <a href="https://waze.com/ul?q=${p.adres}&navigate=yes" target="_blank" class="waze-btn" style="margin-top:8px;display:inline-flex">🚗 Nawiguj w Waze</a>
        </div>`).join('')}
      <button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="closeModal('modal-detail')">Zamknij</button>
    `;
    openModal('modal-detail');
  }, () => toast('Nie można pobrać lokalizacji'));
}

// ══════════════════════════════════════════════
// SKANER
// ══════════════════════════════════════════════
async function openScanner() {
  openModal('modal-scanner');
  try {
    STATE.scanStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 } }
    });
    document.getElementById('scanner-video').srcObject = STATE.scanStream;
  } catch(e) {
    toast('❌ Brak dostępu do kamery');
    closeModal('modal-scanner');
  }
}

function closeScanner() {
  if (STATE.scanStream) { STATE.scanStream.getTracks().forEach(t => t.stop()); STATE.scanStream = null; }
  closeModal('modal-scanner');
}

function setScanMode(mode, btn) {
  STATE.scanMode = mode;
  document.querySelectorAll('#modal-scanner .tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('scan-result').textContent = mode === 'tablica'
    ? 'Skieruj kamerę na tablicę rejestracyjną...'
    : 'Skieruj kamerę na numer VIN...';
}

async function captureFrame() {
  const video = document.getElementById('scanner-video');
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);

  document.getElementById('scan-result').textContent = '🔍 Przetwarzam...';

  // OCR przez API Claude (Anthropic)
  const base64 = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 100,
        messages: [{
          role: 'user',
          content: [
            { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: base64 } },
            { type: 'text', text: STATE.scanMode === 'tablica'
              ? 'Podaj TYLKO numer rejestracyjny z tablicy na zdjęciu. Sama litera/cyfry, bez niczego innego. Jeśli nie widzisz tablicy, napisz: BRAK.'
              : 'Podaj TYLKO numer VIN z tego zdjęcia. Same znaki, bez spacji ani innych słów. Jeśli nie widzisz VIN, napisz: BRAK.'
            }
          ]
        }]
      })
    });
    const data = await resp.json();
    const wynik = data.content?.[0]?.text?.trim() || 'Nie rozpoznano';
    document.getElementById('scan-result').textContent = wynik;
    if (wynik !== 'BRAK') {
      navigator.clipboard?.writeText(wynik);
      toast('✅ Skopiowano: ' + wynik);
    }
  } catch(e) {
    document.getElementById('scan-result').textContent = 'Błąd OCR – spróbuj ponownie';
  }
}

// ══════════════════════════════════════════════
// VOICE
// ══════════════════════════════════════════════
function toggleVoice(targetId) {
  const btn = document.getElementById('voice-btn');
  if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
    toast('❌ Dyktowanie niedostępne w tej przeglądarce');
    return;
  }
  if (STATE.recognition) {
    STATE.recognition.stop();
    STATE.recognition = null;
    btn.classList.remove('recording');
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const rec = new SR();
  rec.lang = 'pl-PL';
  rec.continuous = true;
  rec.interimResults = true;
  rec.onresult = e => {
    const text = Array.from(e.results).map(r => r[0].transcript).join('');
    document.getElementById(targetId).value = text;
  };
  rec.onend = () => { btn.classList.remove('recording'); STATE.recognition = null; };
  rec.start();
  STATE.recognition = rec;
  btn.classList.add('recording');
  toast('🎤 Mówię...');
}

// ══════════════════════════════════════════════
// NOTIFICATIONS
// ══════════════════════════════════════════════
async function requestNotifications() {
  if (!('Notification' in window)) { toast('❌ Powiadomienia niedostępne'); return; }
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') { toast('❌ Brak zgody na powiadomienia'); return; }
  toast('✅ Powiadomienia włączone!');
  scheduleNotifications();
}

function scheduleNotifications() {
  // Planuj codzienne powiadomienia przez SW
  if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
    scheduleDaily(8, 0,  'Serwis PRO+ – Plan dnia', buildPlanDniaMsg());
    scheduleDaily(20, 0, 'Serwis PRO+ – Koniec dnia', buildKoniecDniaMsg());
  }
}

function scheduleDaily(hour, min, title, body) {
  const now = new Date();
  const target = new Date(now);
  target.setHours(hour, min, 0, 0);
  if (target <= now) target.setDate(target.getDate() + 1);
  const delay = target - now;
  setTimeout(() => {
    if (Notification.permission === 'granted') {
      new Notification(title, { body, icon: '/icon-192.png' });
    }
    setInterval(() => {
      if (Notification.permission === 'granted') {
        new Notification(title, { body: hour === 8 ? buildPlanDniaMsg() : buildKoniecDniaMsg(), icon: '/icon-192.png' });
      }
    }, 24 * 60 * 60 * 1000);
  }, delay);
}

function buildPlanDniaMsg() {
  const dzis = new Date().toISOString().split('T')[0];
  const wizyt = STATE.zlecenia.filter(z => z.data === dzis);
  if (wizyt.length === 0) return 'Dziś nie masz zaplanowanych wizyt.';
  return `Masz ${wizyt.length} wizyt na dziś:\n` + wizyt.slice(0,3).map(z => `• ${z.klient}`).join('\n');
}

function buildKoniecDniaMsg() {
  const niezamkn = STATE.zlecenia.filter(z => z.status === '🆕 nowe' || z.status === '⚙️ w toku');
  if (niezamkn.length === 0) return '✅ Wszystkie zlecenia zamknięte. Dobra robota!';
  return `Masz ${niezamkn.length} niezamkniętych zleceń. Sprawdź plan!`;
}

function eksportKlienci() {
  const rows = ['Title,Note'];
  STATE.klienci.filter(k => k.adres).forEach(k => {
    const adres = [k.adres, k.miasto, 'Polska'].filter(Boolean).join(', ');

function openEditZlecenie(id) {
  const z = STATE.zlecenia.find(x => x.id === id);
  if (!z) return;
  closeModal('modal-detail');

  document.getElementById('edit-zl-id').value = z.id;
  document.getElementById('edit-zl-zadanie').value = z.zadanie || '';
  document.getElementById('edit-zl-data').value = z.data || '';
  document.getElementById('edit-zl-notatki').value = z.notatki || '';
  document.getElementById('edit-zl-przychod').value = z.przychod || '';
  document.getElementById('edit-zl-koszt').value = z.koszt || '';

  const selK = document.getElementById('edit-zl-klient');
  selK.innerHTML = STATE.klienci.map(k =>
    `<option ${k.nazwa===z.klient?'selected':''}>${k.nazwa}</option>`
  ).join('');

  const selS = document.getElementById('edit-zl-status');
  Array.from(selS.options).forEach(o => o.selected = o.value === z.status);

  openModal('modal-edit-zlecenie');
}

async function saveEditZlecenie() {
  const id       = document.getElementById('edit-zl-id').value;
  const z        = STATE.zlecenia.find(x => x.id === id);
  if (!z) return;

  const klient   = document.getElementById('edit-zl-klient').value;
  const zadanie  = document.getElementById('edit-zl-zadanie').value;
  const data     = document.getElementById('edit-zl-data').value;
  const status   = document.getElementById('edit-zl-status').value;
  const przychod = parseFloat(document.getElementById('edit-zl-przychod').value) || 0;
  const koszt    = parseFloat(document.getElementById('edit-zl-koszt').value) || 0;
  const notatki  = document.getElementById('edit-zl-notatki').value;

  // Update locally immediately
  z.klient   = klient;
  z.zadanie  = zadanie;
  z.data     = data;
  z.status   = status;
  z.przychod = przychod;
  z.koszt    = koszt;
  z.bilans   = przychod - koszt;
  z.notatki  = notatki;

  closeModal('modal-edit-zlecenie');
  toast('✅ Zlecenie zaktualizowane');
  renderView(currentView);

  // Save to Sheets in background
  await api('updateZlecenie', 'POST', { id, klient, zadanie, data, status, przychod, koszt, notatki });
}

function deleteZlecenie(id) {
  if (!confirm('Usunąć zlecenie ' + id + '?')) return;
  STATE.zlecenia = STATE.zlecenia.filter(x => x.id !== id);
  closeModal('modal-edit-zlecenie');
  toast('🗑 Zlecenie usunięte lokalnie');
  renderView(currentView);
  api('deleteZlecenie', 'POST', { id });
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');

  el.classList.add('show');

function fmt(n) {
  const num = parseFloat(n) || 0;
  return num.toLocaleString('pl-PL', { maximumFractionDigits: 0 });
}

function formatDate(d) {
  return d.toLocaleDateString('pl-PL', { weekday:'long', day:'numeric', month:'long' });
}

function toDateStr(d) {
  return d.toISOString().split('T')[0];
}
